# Builds and publishes the multi-architecture Docker image whenever a stable version tag
# is pushed. See specs/003-docker-image-publish/ for the full spec, plan, and design
# decisions behind this workflow, and specs/004-dockerhub-readme-sync/ for the
# sync-dockerhub-overview job below.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME          - Docker Hub username for the cwiesbaum namespace
#   DOCKERHUB_TOKEN             - Docker Hub access token with Read/Write scope (image push)
#   DOCKERHUB_DESCRIPTION_TOKEN - Docker Hub access token with Read/Write/Delete scope,
#                                 required by peter-evans/dockerhub-description's Hub API
#                                 call (Read/Write alone gets "Error: Forbidden" from it).
#                                 Kept separate from DOCKERHUB_TOKEN so the image-push job
#                                 doesn't run with delete-capable credentials it never needs.
name: Publish Docker image

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-*'
  # Lets the Docker Hub description/overview be re-synced on demand (e.g. after a README
  # edit) without cutting a new release — see specs/004-dockerhub-readme-sync/.
  workflow_dispatch: {}

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install cargo-zigbuild + Zig cross-compilation toolchain
        # Mirrors .devcontainer/features/rust-cross/install.sh's approach: the ubuntu-latest
        # runner already ships a Rust toolchain via actions-rs/toolchain-less default, so
        # this only adds what that toolchain lacks (Zig + cargo-zigbuild + musl targets).
        run: |
          python3 -m pip install --break-system-packages ziglang 2>/dev/null || python3 -m pip install ziglang
          cargo install --locked cargo-zigbuild
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - name: Cross-compile both target binaries
        run: ./scripts/build-cross-binaries.sh

      - name: Verify tag matches Cargo.toml version
        run: ./scripts/check-version-matches-tag.sh "${{ github.ref_name }}"

      - name: Set up QEMU (for running the arm64 image, not compiling it)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke-test amd64 image
        run: ./scripts/docker-smoke-test.sh linux/amd64

      - name: Smoke-test arm64 image
        run: ./scripts/docker-smoke-test.sh linux/arm64

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture image
        run: ./scripts/publish-image.sh

  sync-dockerhub-overview:
    # Runs after `publish` succeeds on a real release, or standalone when manually
    # triggered via workflow_dispatch (in which case `publish` is skipped by its own
    # `if:` above, and `needs.publish.result == 'skipped'` still allows this job to run).
    # A failure here is surfaced clearly (no continue-on-error/suppressed exit status, per
    # FR-006 and constitution Principle IV) but — being a separate job — can never affect
    # an already-succeeded `publish` job's image tag(s) (FR-007).
    needs: publish
    if: |
      always() &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync Docker Hub description and overview
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: cwiesbaum/jellyfin-catalog-export
          short-description: "Export a Jellyfin movie library to a self-contained static site"
          readme-filepath: ./README.md
